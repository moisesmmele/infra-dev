include:
  - portainer/compose.yml
  - cloudbeaver/compose.yml
  - redis-insight/compose.yml
  - mailpit/compose.yml
  #  - hoppscotch/compose.yml
  - npm/compose.yml
  - technitium/compose.yml
  - homepage/compose.yml

services:
  init:
    build: ./init
    volumes:
      - ./init/init.sh:/init.sh
      - ./.env:/.env
      - ./certs:/certs
    depends_on:
      portainer:
        condition: service_healthy
      cloudbeaver:
        condition: service_healthy
      redis-insight:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      npm:
        condition: service_healthy
      technitium:
        condition: service_healthy
      homepage:
        condition: service_healthy
    networks:
      - dev_net

networks:
  dev_net:
    external: true
    name: ${NETWORK_NAME}
