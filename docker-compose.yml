include:
  # currently disabled
  # - homepage/compose.yml
  # - redis-insight/compose.yml
  # - cloudbeaver/compose.yml
  - portainer/compose.yml
  - technitium/compose.yml
  - npm/compose.yml
  - nats-nui/compose.yml
  - mongoku/compose.yml
  - mailpit/compose.yml
  - restfox/compose.yml

services:
  cert-server:
    image: python:alpine
    container_name: cert-server
    command: python -m http.server 80 --directory /www
    volumes:
      - ./certs/ca/public/:/www:ro
    networks:
      - dev_net
    restart: unless-stopped

  init:
    build: ./init
    container_name: init
    command: bash /init.sh
    volumes:
      - ./init/init.sh:/init.sh
      - ./.env:/.env
      - ./certs:/certs
    depends_on:
      portainer:
        condition: service_started 
      npm:
        condition: service_started # Should be healthy
      restfox:
        condition: service_started
      cert-server:
        condition: service_started
      mongoku:
        condition: service_started
      nats-nui:
        condition: service_started
      technitium:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # Currently disabled
      # homepage:
      #   condition: service_healthy
      # redis-insight:
      #  condition: service_started
      # cloudbeaver:
      #   condition: service_healthy

    networks:
      - dev_net

networks:
  dev_net:
    external: true
    name: ${DOCKER_NETWORK_NAME}
