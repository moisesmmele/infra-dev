include:
  - portainer/compose.yml
  - cloudbeaver/compose.yml
  - redis-insight/compose.yml
  - mailpit/compose.yml
  - restfox/compose.yml
  - npm/compose.yml
  - technitium/compose.yml
  - homepage/compose.yml
  - mongoku/compose.yml
  - nats-nui/compose.yml

services:
  cert-server:
    image: python:alpine
    container_name: cert-server
    command: python -m http.server 80 --directory /www
    volumes:
      - ./certs/public:/www
    networks:
      - dev_net
    restart: unless-stopped

  init:
    build: ./init
    volumes:
      - ./init/init.sh:/init.sh
      - ./.env:/.env
      - ./certs:/certs
    depends_on:

      # Temporary "started" condition until healthcheck is fixed
      portainer:
        condition: service_started

      cloudbeaver:
        condition: service_healthy

      # Temporary "started" condition until healthcheck is fixed
      redis-insight:
        condition: service_started

      mailpit:
        condition: service_healthy

      # Temporary "started" condition until healthcheck is fixed
      npm:
        condition: service_started

      technitium:
        condition: service_healthy

      homepage:
        condition: service_healthy

      # Temporary "started" because no healthcheck defined
      restfox:
        condition: service_started

      # Temporary "started" because no healthcheck defined
      cert-server:
        condition: service_started

      # Temporary "started" because no healthcheck defined
      mongoku:
        condition: service_started

      # Temporary "started" because no healthcheck defined
      nats-nui:
        condition: service_started

    networks:
      - dev_net

networks:
  dev_net:
    external: true
    name: ${DOCKER_NETWORK_NAME}
