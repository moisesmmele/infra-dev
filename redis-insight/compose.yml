services:
  redis-insight:
    image: redis/redisinsight:latest
    container_name: ${REDIS_INSIGHT_CONTAINER_NAME}
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5540/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./data:/data
    networks:
      - dev_net

networks:
  dev_net:
    external: true
    name: ${NETWORK_NAME}
