- Infrastructure:
    - Portainer:
        icon: portainer.png
        href: {{HOMEPAGE_VAR_PORTAINER_URL}}
        description: Container Management
        server: my-docker
        container: portainer
        widget:
          type: portainer
          url: {{HOMEPAGE_VAR_PORTAINER_URL}}
          env: 2
          key: your-api-key # Optional: Add API key for widget stats
    - Technitium DNS:
        icon: technitium-dns.png
        href: {{HOMEPAGE_VAR_TECHNITIUM_URL}}
        description: DNS Server & Ad Blocker
        server: my-docker
        container: technitium
        widget:
          type: technitium
          url: {{HOMEPAGE_VAR_TECHNITIUM_URL}}
          password: admin # Default password, change if needed
    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: {{HOMEPAGE_VAR_NPM_URL}}
        description: Reverse Proxy Manager
        server: my-docker
        container: npm
        widget:
          type: npm
          url: {{HOMEPAGE_VAR_NPM_URL}}
          username: admin@example.com
          password: changeme

- Development:
    - CloudBeaver:
        icon: dbeaver.png
        href: {{HOMEPAGE_VAR_CLOUDBEAVER_URL}}
        description: Database Manager
        server: my-docker
        container: cloudbeaver
    - Redis Insight:
        icon: redis.png
        href: {{HOMEPAGE_VAR_REDIS_INSIGHT_URL}}
        description: Redis GUI
        server: my-docker
        container: redis-insight
    - Mailpit:
        icon: mailpit.png
        href: {{HOMEPAGE_VAR_MAILPIT_URL}}
        description: Email Testing
        server: my-docker
        container: mailpit
    - Hoppscotch:
        icon: hoppscotch.png
        href: {{HOMEPAGE_VAR_HOPPSCTOCH_URL}}
        description: API Testing
        server: my-docker
        container: hoppscotch
